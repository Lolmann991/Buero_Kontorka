<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Конторка</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #d8e6d8;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app { position: fixed; inset: 0; overflow: hidden; }

    /* Размытая копия фото на весь экран: заполняет поля, если окно шире кадра */
    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(18px) brightness(0.55);
      transform: scale(1.1);
      pointer-events: none;
    }

    /* ---------- сцена 16:9, все слои в процентах ---------- */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      /* Кадр 16:9 занимает всю ширину окна. Если окно шире, лишнее обрезается
         сверху и снизу, но не больше ~9% высоты (195 вместо 177.78). */
      width: min(100vw, 195vh);
      width: min(100vw, 195dvh);
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      container-type: inline-size;
      background: #000;
    }
    .desk-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .layer { position: absolute; box-sizing: border-box; }

    /* Мониторы: сюда на этапах 3 и 7 встанут карта камер и Teams */
    .monitor-left  { left: 4.07%;  top: 15.73%; width: 45.87%; height: 48.03%; }
    .monitor-right { left: 50.84%; top: 15.73%; width: 45.57%; height: 48.03%; }

    /* Часы Sony: SVG в координатах фото (1672x941), цифры рисуются сегментами */
    .clock-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .clock-svg .seg { fill: #14b014; }

    /* ---------- карта камер на левом мониторе ---------- */
    .monitor-left { container-type: inline-size; overflow: hidden; }
    .cam-map { position: absolute; inset: 4% 2% 14% 2%; }
    .cam-room {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid rgba(80, 160, 80, 0.35);
      background: rgba(40, 110, 40, 0.08);
      border-radius: 2px;
    }
    .cam-room--blind { border-style: dashed; border-color: rgba(160, 160, 160, 0.3); background: transparent; }
    .cam-room--desk {
      display: flex; align-items: center; justify-content: center;
      border-color: rgba(150, 200, 255, 0.5); background: transparent;
      font-size: clamp(0.5rem, 2.2cqw, 0.9rem); color: rgba(170, 210, 255, 0.85);
    }
    .cam-room--nb { background: rgba(255, 200, 60, 0.18); }
    .cam-room--hl {
      border-color: #ffd24a;
      background: rgba(255, 210, 74, 0.28);
      box-shadow: 0 0 6px rgba(255, 210, 74, 0.6);
    }
    .cam-btn {
      position: absolute;
      width: clamp(2.2rem, 6.5cqw, 3.4rem);
      height: clamp(2.2rem, 6.5cqw, 3.4rem);
      padding: 0;
      transform: translate(-50%, -50%);
      border: 2px solid #4fbf4f;
      border-radius: 50%;
      background: #071007;
      color: #8fe08f;
      font: 700 clamp(0.8rem, 2.6cqw, 1.3rem) / 1 system-ui, sans-serif;
      touch-action: manipulation;
    }
    .cam-btn:active, .cam-btn--active { background: #1a4a1a; color: #fff; box-shadow: 0 0 8px #4fbf4f; }
    .cam-caption {
      position: absolute; left: 2%; right: 2%; bottom: 3%; height: 9%;
      display: flex; align-items: center;
      color: #8fe08f; font-size: clamp(0.65rem, 2.2cqw, 1rem);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- стартовый экран ---------- */
    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: rgba(0, 0, 0, 0.88);
      text-align: center;
      padding: 1rem;
    }
    .start-screen[hidden] { display: none; }
    .start-title { margin: 0; font-size: clamp(1.6rem, 6vw, 3rem); letter-spacing: 0.08em; }
    .start-hint { margin: 0; font-size: 1rem; opacity: 0.7; }
    .start-btn {
      min-width: 12rem;
      min-height: 3.5rem;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 1.25rem;
      color: #d8e6d8;
      background: #101810;
      border: 2px solid #3a5a3a;
      border-radius: 0.4rem;
      touch-action: manipulation;
    }
    .start-btn:active { background: #1d2d1d; }

    /* ---------- подсказка «поверни устройство» ---------- */
    .rotate-hint {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #000;
      text-align: center;
      font-size: 1.25rem;
    }
    @media (orientation: portrait) {
      .rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>

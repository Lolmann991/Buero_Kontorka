<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Конторка</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050505;
      color: #9fdc9f;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    #app { position: relative; width: 100%; height: 100%; }
    /* Временная заглушка этапа 0. Удаляется на этапе 1. */
    #boot {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.5rem; text-align: center;
    }
    #boot-title { font-size: 1.5rem; }
    #boot-tick { font-size: 1rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div id="boot-title"></div>
      <div id="boot-tick"></div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
